name: rootfs

on:
  workflow_dispatch:
    inputs:
      sizemb:
        description: volume size in MiB
        default: "24"
  push:
    branches: [mt6983]
    paths:
      - "rootfs/**"
      - ".github/workflows/rootfs.yml"

jobs:
  image:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build HFS+ image
        run: |
          bash rootfs/build-image.sh "${{ inputs.sizemb || '24' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: root-hfs
          path: rootfs/out/root-hfs.img.gz
          retention-days: 14
